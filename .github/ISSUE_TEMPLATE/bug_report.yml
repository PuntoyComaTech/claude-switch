name: Bug report
description: Something does not work as described in the README
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste tokens, `.credentials.json`, Keychain contents or saved profiles.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude-switch --version` and `claude --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, WSL]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from the claude-switch log
      description: The log is in the data folder (README > How it works). It contains no secrets.
      render: text
