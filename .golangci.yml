version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # Architecture: layer rules enforced below (see AGENTS.md).
    - depguard
    # Duplication and complexity.
    - dupl
    - goconst
    - gocognit
    - gocyclo
    - nestif
    - funlen
    # Correctness and best practices.
    - bodyclose
    - errorlint
    - errname
    - exhaustive
    - gocritic
    - gosec
    - nilerr
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - misspell
    - copyloopvar
    - forbidigo
  settings:
    depguard:
      rules:
        # domain: pure rules. Standard library only, and no I/O packages.
        domain:
          list-mode: strict
          files: ["**/internal/domain/**", "!$test"]
          allow: [$gostd]
          deny:
            - { pkg: os, desc: "domain does no I/O" }
            - { pkg: os/exec, desc: "domain does no I/O" }
            - { pkg: net, desc: "domain does no I/O" }
            - { pkg: io/fs, desc: "domain does no I/O" }
        # app: use cases. Only the domain and its own ports; adapters are injected.
        app:
          list-mode: strict
          files: ["**/internal/app/**", "!$test"]
          allow:
            - $gostd
            - github.com/PuntoyComaTech/claude-switch/internal/domain
          deny:
            - { pkg: os, desc: "app talks to the system through ports" }
            - { pkg: os/exec, desc: "app talks to the system through ports" }
            - { pkg: net, desc: "app talks to the system through ports" }
        # Adapters never depend on the CLI or on each other's wiring.
        adapters:
          list-mode: lax
          files:
            - "**/internal/claudecode/**"
            - "**/internal/store/**"
            - "**/internal/keychain/**"
            - "**/internal/usageapi/**"
            - "**/internal/notify/**"
            - "**/internal/fsutil/**"
            - "**/internal/sysexec/**"
          deny:
            - { pkg: github.com/PuntoyComaTech/claude-switch/internal/cli, desc: "only cmd/ may use cli" }
            - { pkg: github.com/PuntoyComaTech/claude-switch/internal/platform, desc: "platform wires adapters, not the reverse" }
            - { pkg: github.com/spf13/cobra, desc: "CLI framework stays in internal/cli" }
    dupl:
      threshold: 100
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    funlen:
      lines: 80
      statements: 50
    goconst:
      min-len: 3
      min-occurrences: 3
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: unused-parameter
        - name: early-return
    forbidigo:
      # User-facing output goes through app.Service or the cli renderers.
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: write to an io.Writer passed in, not to stdout directly
    gosec:
      excludes:
        - G304 # reading files at configured paths (Claude Code's config, our state) is the point of the stores
        - G204 # exec of `security`/`claude`/`osascript` with fixed names is the point of the adapters
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [dupl, funlen, gosec, goconst, gocognit]
      # Product names in user-facing errors ("Claude Code ...") are capitalised on purpose.
      - text: "error strings should not be capitalized|ST1005"
        source: "Claude Code"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/PuntoyComaTech/claude-switch]
